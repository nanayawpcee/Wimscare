<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New password — WIMScare</title>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="logo">
          <img src="/assets/logo.png" alt="WIMScare" />
          <strong style="font-size: 1.05rem">WIMScare</strong>
        </div>
        <h1>Choose a new password</h1>
        <p class="lead">Set a new password for your account.</p>
        <div class="form-error" id="error"></div>
        <form id="resetForm">
          <div>
            <label class="field" for="password">New password</label>
            <input
              class="field"
              type="password"
              id="password"
              autocomplete="new-password"
              placeholder="At least 8 characters"
            />
            <span class="field-error" id="err-password"></span>
          </div>
          <div>
            <label class="field" for="confirm">Confirm password</label>
            <input class="field" type="password" id="confirm" autocomplete="new-password" />
            <span class="field-error" id="err-confirm"></span>
          </div>
          <button class="btn" type="submit" id="submitBtn" disabled>
            Update password
          </button>
        </form>
      </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
      (function () {
        const { API, wirePasswordToggle, bindField } = WIMS;
        const box = document.getElementById("error");
        const submitBtn = document.getElementById("submitBtn");

        wirePasswordToggle("password");
        wirePasswordToggle("confirm");

        const fields = {
          password: bindField(
            "password",
            (v) => (v.length >= 8 ? "" : "At least 8 characters required"),
            "err-password",
          ),
          confirm: bindField(
            "confirm",
            (v) =>
              v === document.getElementById("password").value
                ? ""
                : "Passwords do not match",
            "err-confirm",
          ),
        };
        document
          .getElementById("password")
          .addEventListener("input", () => fields.confirm.isValid());
        function updateSubmitState() {
          submitBtn.disabled = !Object.values(fields).every((f) => f.isValid());
        }
        Object.keys(fields).forEach((key) => {
          const el = document.getElementById(key);
          el.addEventListener("input", updateSubmitState);
          el.addEventListener("blur", updateSubmitState);
        });
        updateSubmitState();

        document
          .getElementById("resetForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const params = new URLSearchParams(location.search);
            box.classList.remove("show");
            const allValid = Object.values(fields)
              .map((f) => f.forceShow())
              .every(Boolean);
            if (!allValid) {
              box.textContent = "Please fix the highlighted fields before continuing.";
              box.classList.add("show");
              return;
            }
            submitBtn.disabled = true;
            try {
              await API.post("/api/auth/reset-password", {
                email: params.get("email"),
                token: params.get("token"),
                organizationId: params.get("org") || undefined,
                password: document.getElementById("password").value,
              });
              WIMS.toast("Password updated — redirecting to sign in");
              setTimeout(() => (window.location.href = "/login.html"), 1200);
            } catch (err) {
              box.textContent = err.message;
              box.classList.add("show");
              submitBtn.disabled = false;
            }
          });
      })();
    </script>
  </body>
</html>
